<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0E1A">
<title>You're offline | AI4Planning</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:#0A0E1A;color:#E8F0FF;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px;overflow:hidden;position:relative}
  body::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 360px at 50% 38%,rgba(0,212,255,.14),transparent 70%),linear-gradient(rgba(0,212,255,.045) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(0,212,255,.045) 1px,transparent 1px) 0 0/44px 44px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%)}
  main{position:relative;text-align:center;max-width:380px}
  .mark{width:92px;height:92px;margin:0 auto 26px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,#0f2740,#0a1626);border:1px solid rgba(0,212,255,.35);box-shadow:0 0 0 6px rgba(0,212,255,.06),0 18px 44px rgba(0,0,0,.5),0 0 40px rgba(0,212,255,.18)}
  .brand{font-size:13px;letter-spacing:.18em;font-weight:600;color:#7fdcf2;margin-bottom:14px}
  h1{font-size:26px;font-weight:700;margin-bottom:10px}
  p{font-size:14.5px;line-height:1.6;color:#A8B8D8;margin-bottom:26px}
  button{font:inherit;font-size:14px;font-weight:700;color:#021019;background:#00D4FF;border:0;border-radius:999px;padding:12px 30px;cursor:pointer;transition:background .15s,transform .15s}
  button:hover{background:#4fe3ff}button:active{transform:scale(.97)}
  .status{margin-top:18px;font-size:12px;color:#5A6A8A;min-height:16px}
  .pulse{animation:p 2s ease-in-out infinite}@keyframes p{50%{opacity:.45}}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg width="52" height="52" viewBox="0 0 48 48" fill="none" stroke="#00D4FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 22 24 9l16 13"/><path d="M12 20v18h24V20"/><path d="M20 38V28h8v10"/>
      <path class="pulse" d="M17 15a10 10 0 0 1 14 0" stroke-width="1.8" opacity=".7"/>
    </svg>
  </div>
  <div class="brand">AI4PLANNING</div>
  <h1>You're offline</h1>
  <p>AI4Planning needs an internet connection to check properties and load planning data. Reconnect and try again.</p>
  <button id="retry" type="button">Retry</button>
  <div class="status" id="status" role="status"></div>
</main>
<script>
  var s=document.getElementById('status');
  function go(){location.href='/'}
  document.getElementById('retry').addEventListener('click',function(){
    s.textContent='Checking connection…';
    fetch('/favicon.ico',{cache:'no-store'}).then(function(){go()}).catch(function(){s.textContent='Still offline — please check your connection.'});
  });
  window.addEventListener('online',go);
</script>
</body>
</html>
